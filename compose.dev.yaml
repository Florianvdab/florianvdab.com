# Build and run the production image locally: http://127.0.0.1:8091
#   docker compose -f compose.dev.yaml up --build     (Ctrl+C, then `down` to clean up)
services:
  web:
    build: .
    image: florianvdab-site:dev
    ports:
      - 127.0.0.1:8091:8080
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
