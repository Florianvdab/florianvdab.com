name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: No client-side JavaScript in the build
        run: |
          if find dist -name '*.js' | grep -q .; then
            echo "::error::dist/ contains JavaScript:"; find dist -name '*.js'; exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push; the server builds its own image from main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: florianvdab-site:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name site --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 florianvdab-site:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8080/ | tee headers.txt
          grep -qi '^content-security-policy:' headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope)" = 404
          docker image ls florianvdab-site:ci
