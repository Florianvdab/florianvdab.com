server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;  # redirects stay relative, never leak the internal :8080

    # Real visitor IP in logs. Only Cloudflare's connector reaches this container, via the host's
    # loopback-published port, so the direct peer is always a local/Docker address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/xml application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    # Hashed build assets: cache forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed static files (favicons, og-image, robots, sitemap): cache a day.
    location ~* \.(?:ico|png|svg|txt|xml|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # HTML: always revalidate so a deploy shows up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
